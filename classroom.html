<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الدخول إلى حصة الماستر</title><style>@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');body{font-family:Tajawal,sans-serif;background:#edf3f2;color:#17313d;max-width:700px;margin:10vh auto;padding:26px;line-height:1.9}h1{font-size:32px}a,button{display:inline-block;padding:12px 20px;background:#1b676a;color:white;border:0;border-radius:8px;text-decoration:none;font:inherit}input{font:inherit;padding:12px;border:1px solid #aebfc2;border-radius:8px;width:95%;margin:15px 0}</style><h1>ماستر الإعلام والتواصل وصناعة المحتوى الرقمي</h1><p id="status">أدخل رمز الحصة الموجود في الرابط الذي شاركه الأستاذ.</p><form id="join"><label>رمز الحصة<input id="room" required pattern="[a-f0-9]{16}" dir="ltr"></label><button>فتح الحصة</button></form><p>تختار اسمك وتدخل رمزك الخاص في صفحة الحصة. لا تكتب رمزك الخاص في رابط الصفحة.</p><a href="admin.html">دخول الأستاذ</a><script>const room=new URLSearchParams(location.search).get('room')||'';function openRoom(id){if(/^[a-f0-9]{16}$/.test(id))location.replace('https://nabih-master-studio.flab2025.chatgpt.site/?room='+id)}if(room){document.getElementById('status').textContent='جارٍ فتح الحصة…';openRoom(room)}document.getElementById('join').onsubmit=e=>{e.preventDefault();openRoom(document.getElementById('room').value.trim())};</script></html>
