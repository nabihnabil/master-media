function openVideo(id){$('original').href='https://www.youtube.com/watch?v='+id;$('player').innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${id}?rel=0" title="الفيديو الأصلي" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe>`;$('video').showModal()}
$('video').addEventListener('close',()=>$('player').replaceChildren());document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{if(b.dataset.close==='video')$('player').replaceChildren();$(b.dataset.close).close()});$('prev').onclick=()=>go(pos-1);$('next').onclick=()=>go(pos+1);$('reveal').onclick=reveal;$('note').onclick=()=>$('notes').showModal();$('contents').onclick=()=>{const list=$('overview').querySelector('.list');list.replaceChildren();slides.forEach((s,i)=>{const b=document.createElement('button');b.textContent=String(i+1).padStart(2,'0')+' · '+s.title;b.className=i===pos?'current':'';b.onclick=()=>{go(i);$('overview').close()};list.append(b)});$('overview').showModal()};async function full(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){$('full').textContent='استخدم ملء شاشة المتصفح'}}$('full').onclick=full;
document.addEventListener('keydown',e=>{if(document.querySelector('dialog[open]')||['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowLeft'||e.key==='PageDown'){e.preventDefault();go(pos+1)}if(e.key==='ArrowRight'||e.key==='PageUp'){e.preventDefault();go(pos-1)}if(e.code==='Space'&&!['BUTTON','A'].includes(document.activeElement.tagName)){e.preventDefault();reveal()}if(e.key.toLowerCase()==='f')full();if(e.key==='Home')go(0);if(e.key==='End')go(slides.length-1)});function fromHash(){const m=location.hash.match(/^#slide-(\d+)$/);pos=m?Math.max(0,Math.min(slides.length-1,Number(m[1])-1)):0;render()}window.addEventListener('hashchange',fromHash);fromHash();
